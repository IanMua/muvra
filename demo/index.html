<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Muvra</title>
    <link rel="icon" href="data:," />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font:
          15px/1.5 system-ui,
          sans-serif;
        background: #eef2f6;
        color: #183146;
      }
      main {
        max-width: 1100px;
        margin: auto;
        padding: 20px;
      }
      h1 {
        margin: 0 0 4px;
      }
      header p {
        margin: 0 0 16px;
        color: #526577;
      }
      .toolbar {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 14px;
      }
      button,
      input {
        font: inherit;
        border-radius: 7px;
        border: 1px solid #9aafbf;
        padding: 8px 12px;
      }
      button {
        background: white;
        color: #183146;
        cursor: pointer;
      }
      button:focus-visible,
      input:focus-visible {
        outline: 3px solid #147a7a;
        outline-offset: 3px;
      }
      .frames {
        display: grid;
        grid-template-columns: minmax(0, 2fr) minmax(240px, 1fr);
        gap: 18px;
      }
      .frame {
        height: 520px;
        background: white;
        border: 1px solid #c6d2db;
        border-radius: 12px;
        overflow: hidden;
      }
      .page {
        min-height: 100%;
        padding: 24px;
        background: white;
      }
      .page h2 {
        margin-top: 0;
      }
      .page input {
        display: block;
        width: 100%;
        margin: 12px 0 18px;
      }
      .actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .overlay {
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 22px;
        background: #122c4b66;
      }
      .card {
        background: white;
        border-radius: 12px;
        padding: 22px;
        box-shadow: 0 12px 35px #10223540;
        width: 100%;
      }
      .card input {
        width: 100%;
        margin: 12px 0;
      }
      .status {
        margin-top: 16px;
        padding: 14px;
        background: #122c4b;
        color: #dcf5ff;
        border-radius: 8px;
        white-space: pre-wrap;
        font:
          13px/1.6 ui-monospace,
          monospace;
        overflow: auto;
      }
      .caption {
        font-size: 12px;
        color: #526577;
      }
      label {
        display: block;
      }
      label input[type="checkbox"] {
        display: inline;
        width: auto;
        margin: 4px;
      }
      .shared {
        font-size: 12px;
        color: #526577;
      }
      @media (max-width: 700px) {
        main {
          padding: 12px;
        }
        .frames {
          grid-template-columns: 1fr;
        }
        .frame.secondary {
          height: 160px;
        }
        .frame {
          height: 540px;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/demo/app.js"></script>
  </body>
</html>
